<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Glowing Clapperboard Shape -->
  <g filter="url(#glow)">
    <!-- Clapper Bottom / Body -->
    <rect x="14" y="26" width="36" height="24" rx="4" fill="#0f172a" stroke="url(#brandGrad)" stroke-width="2"/>

    <!-- Film Reel Triangle / Play Symbol in Center -->
    <polygon points="30,33 40,38 30,43" fill="url(#brandGrad)"/>

    <!-- Clapper Top Slanted Bar -->
    <g transform="rotate(-6 14 22)">
      <rect x="13" y="14" width="38" height="9" rx="3" fill="url(#brandGrad)"/>
      <!-- Slanted Stripe Accents -->
      <polygon points="19,14 23,14 19,23 15,23" fill="#ffffff" opacity="0.9"/>
      <polygon points="28,14 32,14 28,23 24,23" fill="#ffffff" opacity="0.9"/>
      <polygon points="37,14 41,14 37,23 33,23" fill="#ffffff" opacity="0.9"/>
      <polygon points="46,14 50,14 46,23 42,23" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Small Sparkle / Star Indicator -->
    <circle cx="48" cy="14" r="2.5" fill="url(#goldGrad)"/>
  </g>
</svg>